# Jalankan pertama kali: docker compose up --build
# Jalankan berikutnya:   docker compose up
# Layanan: db (PostgreSQL 16), backend (FastAPI + --reload), frontend (Next.js dev server).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: ${POSTGRES_DB:-sis}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5432:5432"  # lokal saja (untuk DBeaver)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sis} -d ${POSTGRES_DB:-sis}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Menjalankan bootstrap lalu uvicorn dengan --reload agar perubahan file Python langsung dimuat ulang
    command: sh -c "python -m scripts.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sis}
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_SEND_DATA: ${GEMINI_SEND_DATA:-0}
      DATASET_DIR: /data/dataset_bersih
      SQL_DIR: /data/init
      SEED_OUTPUT_DIR: /app/seed_output
      TZ: Asia/Jakarta
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./database/dataset_bersih:/data/dataset_bersih:ro
      - ./database/init:/data/init:ro
      - ./backend/seed_output:/app/seed_output
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    # Target 'build' berhenti sebelum tahap production standalone, sehingga npm dan seluruh source/devDependencies tersedia
    build:
      context: ./frontend
      target: build
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Menjalankan Next.js dev server (Fast Refresh)
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      WATCHPACK_POLLING: "true" # Memastikan file watcher tetap mendeteksi perubahan file di Docker Desktop Windows
    volumes:
      - ./frontend:/app
      - /app/node_modules # Anonymous volume agar node_modules Linux di dalam image tidak tertimpa folder lokal
      - /app/.next
    ports:
      - "3000:3000"

volumes:
  pgdata: